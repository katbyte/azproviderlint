# NOTE: this config enables the azproviderlint module plugin - this repo's own AZG rules run on
# its own code - which only exists in the custom-built binary produced by make
# (.tools/bin/golangci-with-modules, config in .tools/.custom-gcl.yml). Run lints via
# 'make lint', not stock golangci-lint.
version: "2"

run:
  timeout: 60m
  modules-download-mode: vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - asasalint # check for pass []any as any in variadic func(...any)
    - asciicheck # ensure code does not contain non-ASCII identifiers
    - azproviderlint # this repo's own linter (module plugin); AZG general Go style rules only
    - bidichk # checks for dangerous unicode character sequences
    - bodyclose # checks whether HTTP response bodies are closed
    - canonicalheader # checks that net/http.Header keys use canonical form (e.g. Content-Type)
    - copyloopvar # detects range loop variables that are overwritten in the loop body
    - decorder # check declaration order and count of types, constants, variables and functions.
    - durationcheck # check for common mistakes when working with time.Duration
    - dupword # check for duplicated words in comments
    - errcheck # checking for unchecked errors
    - errname # checks sentinel errors are named ErrFoo and error types FooError
    - errorlint # finds code that will cause problems with the error wrapping scheme introduced in Go 1.13.
    - exhaustive # checks switch statements over enums for missing cases
    - exptostd # detects golang.org/x/exp functions that now exist in the standard library
    - fatcontext # detects nested contexts accidentally rebuilt in loops and function literals
    - forcetypeassert # finds unchecked type assertions x.(T) that panic on mismatch
    - gocheckcompilerdirectives # checks //go: compiler directive comments are valid
    - goconst # finds repeated strings that could be replaced by a constant
    - gocritic # linter for Go source code that specializes in simplifying code
    - govet # reports suspicious constructs. It is roughly the same as 'go vet' (replaced vet and vetshadow)
    - gosec # Gosec is a security linter for Go source code
    - ineffassign # detects when assignments to existing variables are not used
    - intrange # finds for loops that could use Go 1.22+ integer ranges (for i := range n)
    - misspell # finds commonly misspelled English words.
    - mirror # reports mismatched bytes/strings function pairs causing needless conversions
    - modernize # suggests simplifications using modern Go language and library features (any, slices.Contains, strings.CutPrefix, etc.)
    - nilerr # Finds code that returns nil after it checks that the error is not nil.
    - nilnesserr # finds code that checks one error but mistakenly returns a different nil error
    - nakedret # Checks that functions with naked returns are not longer than a maximum size
    - nolintlint # reports ill-formed or unused //nolint directives
    - nosprintfhostport # checks for misuse of Sprintf to construct host:port in a URL
    - prealloc # finds slice declarations that could potentially be pre-allocated.
    - predeclared # find code that shadows one of Go's predeclared identifiers.
    - perfsprint # Checks that fmt.Sprintf can be replaced with a faster alternative.
    - paralleltest # detects missing usage of t.Parallel() method in your Go test.
    - revive # configurable meta-linter; enable-all with specific rules opted out in settings
    - reassign # checks that package variables are not reassigned.
    - recvcheck # checks methods on a type don't mix pointer and value receivers
    - tagalign #  checks struct tags that do not align with the specified column in struct definitions.
    - thelper # detects test helpers missing a t.Helper() call
    - tparallel # Tparallel detects inappropriate usage of t.Parallel() method in your Go test codes.
    - staticcheck # checks rules from staticcheck. It's not the same thing as the staticcheck binary.
    - testableexamples # checks Go examples are testable
    - unused # checks Go code for unused constants, variables, functions and types.
    - unconvert # checks for unnecessary type conversions.
    - unparam # reports unused function parameters.
    - usestdlibvars # detects string literals replaceable by stdlib constants (http.MethodGet, http.StatusNotFound, etc.)
    - usetesting # reports os/context functions with testing replacements (t.Setenv, t.TempDir, t.Context, etc.)
    - wastedassign # finds wasted assignment statements
    - whitespace # checks for unnecessary newlines at the start and end of functions, if, for, etc.
    - noctx # finds sending http request without context.Context
    - makezero # finds slice declarations with non-zero initial length but capacity is initialized

  exclusions:
    rules:
      # the idiomatic `if err := f(); err != nil` scoping shadows err on purpose; still flag other variables
      # and err shadows outside the if-statement form (source scopes the rule to the if idiom only)
      - text: 'shadow: declaration of "err"'
        source: 'if .*err :='
        linters:
          - govet
      # rule packages are deliberately named after their rule IDs (AZR001) and imported under them,
      # following tfproviderlint convention; the same goes for the category packages (AZR, AZS)
      - path: 'checks/'
        text: 'ST1003'
        linters:
          - staticcheck
      - path: 'checks/'
        text: 'package-directory-mismatch|import-alias-naming|package-naming'
        linters:
          - revive
      # table-driven tests repeat literals ("./...", flag names) by nature; constants would hurt readability
      - path: '_test\.go'
        linters:
          - goconst

  settings:
    custom:
      azproviderlint:
        type: module
        settings:
          enable: [AZG] # general Go style rules only; AZR/AZD/AZS/AZT/AZV are azure-provider specific
          # AST nodes are dereferenced straight from type switches and assertions, and AZS006's
          # tree nodes and collector are built non-nil; AZG009 cannot prove either
          AZG009: {exclude-types: "go/ast.*,go/types.*,golang.org/x/tools/*,*/AZS006_*.treeNode,*/AZS006_*.collector"}
    errcheck:
      check-type-assertions: true # unchecked x.(T) assertions panic on mismatch
      exclude-functions:
        - io.Close
    exhaustive:
      default-signifies-exhaustive: true # a default: case satisfies the exhaustiveness check
    gocritic:
      enabled-tags: [diagnostic, style, performance] # enables extra checks like hugeParam and rangeValCopy beyond the default set
      settings:
        # this linter walks ASTs; only flag genuinely huge copies, not every mid-size struct
        rangeValCopy:
          sizeThreshold: 512
        hugeParam:
          sizeThreshold: 512
    revive:
      enable-all-rules: true
      rules:
        - {name: line-length-limit, disabled: true}        # no line length limit here, no matter how unwieldy
        - {name: add-constant, disabled: true}             # goconst-on-steroids; repeated literals in tables and messages are by design
        - {name: exported, disabled: true}                 # doc comments on every exported symbol is more ceremony than needed
        - {name: cognitive-complexity, disabled: true}     # no complexity metric gates, matching the absence of gocyclo/funlen
        - {name: cyclomatic, disabled: true}               # same as cognitive-complexity
        - {name: function-result-limit, disabled: true}    # return-count cap; another metric gate
        - {name: function-length, disabled: true}          # function-size cap; another metric gate
        - {name: argument-limit, disabled: true}           # param-count cap; another metric gate
        - {name: max-control-nesting, disabled: true}      # nesting-depth cap; another metric gate
        - {name: max-public-structs, disabled: true}       # struct-count cap; another metric gate
        - {name: enforce-switch-style, disabled: true}     # empty defaults would silence the stronger exhaustive check
        - {name: flag-parameter, disabled: true}           # bool options plumbed from analyzer flags (tests, include-parameters) are the design
        - {name: unhandled-error, disabled: true}          # errcheck covers this with sane defaults and nolint support
        - {name: unchecked-type-assertion, arguments: [{accept-ignored-assertion-result: true}]} # `fn, _ := obj.(*types.Func)` is the idiom for "nil unless it is one"
    govet:
      enable-all: true # includes nilness and other checks off by default
      disable:
        - fieldalignment # too noisy/pedantic for most codebases
    staticcheck:
      checks: ["all"] # adds the ST* style checks, off by default
    nakedret:
      max-func-lines: 30
    misspell:
      locale: "UK"
      ignore-rules:
        - "color"
        - "organization"
        - "recognized"
    tagalign:
      sort: true
    predeclared:
      ignore: ["new", "min", "max"] # should we use newer, minimum, and maximum instead?

formatters:
  enable:
    - gofmt # checks whether code was gofmt-ed
    - gofumpt # checks whether code was gofumpt-ed, a stricter gofmt
    - goimports # check import statements are formatted according to the 'goimport' command
